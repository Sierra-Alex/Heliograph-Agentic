<style>

function Frame({width,children}){
  const box=useRef(null),inner=useRef(null);
  const [h,setH]=useState(null),[s,setS]=useState(1);
  useLayoutEffect(()=>{
    if(!width)return;
    const fit=()=>{
      if(!box.current||!inner.current)return;
      const scale=Math.min(1,box.current.clientWidth/width);
      setS(scale);setH(inner.current.getBoundingClientRect().height/scale*scale);
    };
    fit();const t=setTimeout(fit,250);window.addEventListener("resize",fit);
    return()=>{clearTimeout(t);window.removeEventListener("resize",fit)};
  },[width]);
  if(!width)return <div className="frame pad">{children}</div>;
  return <div className="frame" ref={box} style={{height:h?h:undefined}}>
    <div className="stage" ref={inner} style={{width,transform:`scale(${s})`}}>{children}</div>
  </div>;
}

function copy(text,say){
  const done=()=>say(text.length>42?"Copied":"Copied “"+text+"”");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,done);
  else{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done()}
}
function copySvg(path,say){

}

    f();window.addEventListener("resize",f);return()=>window.removeEventListener("resize",f);
  },[]);
  return <div className="shot" ref={box}>{src
    ?<iframe src={src} loading="lazy" scrolling="no" style={{transform:`scale(${s})`}}/>
    :<div style={{transform:`scale(${s})`}}>{children}</div>}</div>;
}

function Lazy({minHeight,children}){
  const ref=useRef(null),[on,setOn]=useState(false);
  useEffect(()=>{
    if(!ref.current)return;
    const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){setOn(true);io.disconnect()}},{rootMargin:"600px 0px"});
    io.observe(ref.current);return()=>io.disconnect();
  },[]);
  return <div ref={ref} style={on?undefined:{minHeight}}>{on?children:null}</div>;
}

const HUES_ORDER=["purple","pool","mint","lava","peach","mustard","grass","gray","absolute","white","black"];
function family(t){
  if(t.file==="colors.css"){
    const m=t.name.match(/^--colors-([a-z]+)/);
    return m?m[1]:"other";
  }
  const m=t.name.match(/^--([a-z]+(?:-[a-z]+)?)-/);
  const seg=(t.name.split("-").filter(Boolean)[0])||"other";
  return seg;
}
const FAMILY_LABEL={gray:"Gray",purple:"Purple",pool:"Pool",mint:"Mint",lava:"Lava",peach:"Peach",mustard:"Mustard",grass:"Grass",white:"White",black:"Black",
  surface:"Surface",text:"Text",cards:"Cards",tag:"Tag",interactive:"Interactive",container:"Container fills",divider:"Dividers",status:"Status",absolute:"Absolutes",other:"Other"};
const SEM_ORDER=["surface","text","cards","container","tag","interactive","divider","status"];
function familyRank(f){const i=HUES_ORDER.indexOf(f);if(i>=0)return i;const s=SEM_ORDER.indexOf(f);return s>=0?50+s:100+f.charCodeAt(0)}
function stepNum(name){const m=name.match(/-(\d+)$/);return m?parseInt(m[1],10):999}
function isAlpha(name){return /-alpha-\d+$/.test(name)}
function bySt3p(a,b){return stepNum(a[0].name)-stepNum(b[0].name)||a[0].name.localeCompare(b[0].name)}
function prefixOf(name){
  const segs=name.replace(/^--/,"").split("-").filter(x=>!/^\d+(\.\d+)?$/.test(x));
  return segs.length>2?segs.slice(0,2).join("-"):segs.join("-")||"other";
}
function titleize(p){return p.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ")}
function alphaNote(f,rows){
  const ns=rows.map(r=>stepNum(r[0].name)).filter(n=>n<999).sort((a,b)=>a-b);
  const range=ns.length?(ns[0]===ns[ns.length-1]?ns[0]+"%":ns[0]+"–"+ns[ns.length-1]+"%"):"";
  const subject=f==="absolute"?"Black and white":"The "+(FAMILY_LABEL[f]||f).toLowerCase()+" base hue";
  return "Alpha variants — "+subject.charAt(0).toLowerCase()+subject.slice(1)+" at "+range+" opacity. Use these over imagery or coloured surfaces, never a solid step with your own opacity.";
}

const KIND_ORDER=["color","gradient","type","size","shadow","asset","other"];
const KIND_LABEL={color:"Colour",gradient:"Gradient",type:"Type styles",size:"Sizes & spacing",shadow:"Shadows & blurs",asset:"Asset references",other:"Other"};
const KIND_COLS={color:"col-a",gradient:"col-b",type:"col-1",size:"col-a",shadow:"col-b",asset:"col-a",other:"col-b"};

function classify(v){
  if(/^(linear-gradient|radial-gradient)/.test(v))return "gradient";
  if(/^(#|rgb|hsl)/.test(v))return "color";
  if(/^url\(/.test(v))return "asset";
  if(/^\d+\s+[\d.]+px\s*\/\s*[\d.]+\s+\w/.test(v))return "type";
  if(/(rgba?\(|#[0-9a-f]{3,8})/i.test(v)&&/px/.test(v))return "shadow";
  if(/^-?[\d.]+(px|em|rem|%|s|ms)?$/.test(v))return "size";
  return "other";
}

function TokenChip({t,resolved,kind,maxSize,say}){
  const click=()=>copy("var("+t.name+")",say);
  const tip=t.name+" — click to copy var()";
  const short=resolved.length>64?resolved.slice(0,64)+"…":resolved;
  const body=<div className="tokbody"><div className="tokname">{t.name}</div><div className="tokval">{short}</div></div>;
  if(kind==="color")return <div className="tok flat" onClick={click} title={tip}><div className="sw" style={{background:resolved}}/>{body}</div>;
  if(kind==="gradient")return <div className="tok stack" onClick={click} title={tip}><div className="bar" style={{background:resolved}}/>{body}</div>;
  if(kind==="shadow")return <div className="tok stack" onClick={click} title={tip}><div className="shadowtile"><i style={{boxShadow:resolved}}/></div>{body}</div>;
  if(kind==="type"){
    const px=parseFloat((resolved.match(/([\d.]+)px/)||[])[1])||16;
    return <div className="tok stack" onClick={click} title={tip}>
      <div className="typerow"><span style={{font:resolved,letterSpacing:px>=28?"-0.02em":undefined}}>Ag — Heliograph</span></div>
      {body}
    </div>;
  }
  if(kind==="size"){
    const n=parseFloat(resolved)||0;
    const clamped=Math.max(4,Math.min(48,n));
    return <div className="size-icon" onClick={click} title={tip}>
      <div className="size-icon__box">
        {/px|rem|em/.test(resolved)&&<div className="size-icon__bar" style={{width:clamped,height:clamped}}/>}
        {!/px|rem|em/.test(resolved)&&<div className="tokval num">{resolved}</div>}
      </div>
      <div className="size-icon__label">{resolved}</div>
      <div className="size-icon__name">{t.name.replace(/^--/,"")}</div>
    </div>;
  }
  return <div className="tok flat" onClick={click} title={tip}>{body}</div>;
}

function isGridToken(t){return /^--(breakpoints-|columns-|max-width-|layout-grid-)/.test(t.name)}
function GridTable({tokens,resolvedMap,say}){
  const TIERS=["desktop-plus","desktop","tablet","phone"];
  const LABELS={"desktop-plus":"Desktop+",desktop:"Desktop",tablet:"Tablet",phone:"Phone"};
  const PROPS=["breakpoint","columns","margin","gutter","max-width"];
  const isPrim=tokens.some(t=>t.name.startsWith("--breakpoints-"));
  const find=(tier,prop)=>{
    if(isPrim){
      if(prop==="breakpoint"){const v={"desktop-plus":"1440","desktop":"1200",tablet:"808",phone:"384"}[tier];return tokens.find(t=>t.name==="--breakpoints-"+v)}
      if(prop==="columns"){const v={"desktop-plus":"12","desktop":"12",tablet:"6",phone:"2"}[tier];return tokens.find(t=>t.name==="--columns-"+v)}
      if(prop==="max-width"){const v={"desktop-plus":"1520","desktop":"1360",tablet:"none",phone:"none"}[tier];return tokens.find(t=>t.name==="--max-width-"+v)}
      return null;
    }
    return tokens.find(t=>t.name==="--layout-grid-"+tier+"-"+prop);
  };
  const val=t=>{if(!t)return"—";const v=(resolvedMap[t.name]||t.value);return(v==="none")?"none":v};
  const clean=v=>v.replace("px","");
  const cols=isPrim?["breakpoint","columns","max-width"]:PROPS.filter(p=>TIERS.some(tier=>find(tier,p)));
  const COL_LABELS={breakpoint:"Breakpoint",columns:"Columns",margin:"Margin",gutter:"Gutter","max-width":"Max Width"};
  const rows=TIERS.map(tier=>{
    const cells=cols.map(p=>{const t=find(tier,p);return {token:t,value:t?clean(val(t)):"—"}});
    return {tier,label:LABELS[tier],cells};
  });
  const w=Math.floor(80/cols.length)+"%";
  return <div className="kind">
    <div className="kindhead"><h3>Grid System</h3><span>{tokens.length}</span></div>
    <table><thead><tr><th style={{width:"20%"}}>Tier</th>{cols.map(p=><th key={p} style={{width:w}}>{COL_LABELS[p]}</th>)}</tr></thead>
    <tbody>{rows.map(r=><tr key={r.tier}>
      <td>{r.label}</td>
      {r.cells.map((c,i)=><td key={cols[i]} className="n" style={{cursor:c.token?"pointer":undefined}} onClick={c.token?()=>copy("var("+c.token.name+")",say):undefined} title={c.token?c.token.name:""}>{c.value}</td>)}
    </tr>)}</tbody></table>
  </div>;
}

const TYPO_SIZE_PREFIXES=["font-size","line-height","letter-spacing","font-weight","paragraph-spacing"];
function isTypoSizeToken(t){return TYPO_SIZE_PREFIXES.some(p=>t.name==="--"+p||t.name.startsWith("--"+p+"-"))}
function TypoSizeTable({tokens,resolvedMap,say}){
  const groups=TYPO_SIZE_PREFIXES.map(p=>{
    const toks=tokens.filter(t=>t.name==="--"+p||t.name.startsWith("--"+p+"-"));
    if(!toks.length)return null;
    toks.sort((a,b)=>{const na=parseFloat(resolvedMap[a.name]||a.value)||0,nb=parseFloat(resolvedMap[b.name]||b.value)||0;return na-nb||a.name.localeCompare(b.name)});
    return {prefix:p,label:titleize(p),toks};
  }).filter(Boolean);
  const total=tokens.length;
  return <div className="kind">
    <div className="kindhead"><h3>Typography Sizes</h3><span>{total}</span></div>
    {groups.map(g=><div className="fam" key={g.prefix}>
      <div className="famhead"><h4>{g.label}</h4><span>{g.toks.length}</span></div>
      <table><thead><tr><th style={{width:"55%"}}>Token</th><th style={{width:"45%"}}>Value</th></tr></thead>
      <tbody>{g.toks.map(t=>{const v=resolvedMap[t.name]||t.value;return <tr key={t.name}>
        <td className="n" style={{cursor:"pointer"}} onClick={()=>copy("var("+t.name+")",say)} title={t.name}>{t.name}</td>
        <td className="d">{v}</td>
      </tr>})}</tbody></table>
    </div>)}
  </div>;
}

        <div className="kindhead"><h3>{KIND_LABEL[k]}</h3><span>{rows.length}</span></div>
        {order.map(p=><div className="fam" key={p}>
          <div className="famhead"><h4>{LBL[p]||titleize(p)}</h4><span>{g[p].length}</span></div>
          {NOTE[p]&&<p className="callout">{NOTE[p]}</p>}
          <div className={"toks "+KIND_COLS[k]}>{g[p].map(([t,v])=><TokenChip key={t.name} t={t} resolved={v} kind={k} say={say}/>)}</div>

      const SIZE_ORDER=["alpha","spacing","border-radius","border-width","blur","aspect-ratio"];
      const sizeRank=p=>{const i=SIZE_ORDER.indexOf(p);return i<0?SIZE_ORDER.length:i};

        {order.map(p=>{

                  <div className="alpha-ramp__swatch"><div style={{background:"rgba(255,255,255,"+(parseFloat(v)||0)/100+")",width:"100%",height:"100%",borderRadius:"inherit"}}/></div>

                </div>;

            </div>;
          }
          if(p==="blur"){
            return <div className="fam" key={p}>
              <div className="famhead"><h4>Blur</h4><span>{rs.length}</span></div>
              <div className="radius-ramp">{rs.map(([t,v])=>{
                const px=parseFloat(v)||0;
                return <div key={t.name} className="radius-ramp__chip" onClick={()=>copy("var("+t.name+")",say)} title={t.name}>

function SpacingLayoutShowcase({say}){

        <div className="pat-divider"/>

    </div>
    <div className="palette type-usage">
      <div className="palette__head"><span>Usage in Code</span><div className="palette__divider"/></div>

<MdProductCards color="purple" background="white" />

    </div>
  </div>;
}

function ColorRamps({tokens,resolvedMap,say}){
  const HUE_ORDER=["purple","pool","mint","lava","peach","mustard","grass","gray","absolute"];
  const HUE_LABEL={purple:"Purples",pool:"Pool",mint:"Mint",lava:"Lava",peach:"Peach",mustard:"Mustard",grass:"Grass",gray:"Grays",absolute:"Absolutes"};
  const byHue={};
  for(const t of tokens){const m=t.name.match(/^--colors-([a-z]+)/);if(!m)continue;const h=m[1];if(!HUE_ORDER.includes(h))continue;(byHue[h]=byHue[h]||[]).push(t)}
  const shortName=n=>n.replace(/^--colors-/,"");
  return <>{HUE_ORDER.filter(h=>byHue[h]).map(hue=>{
    const all=byHue[hue];
    const solid=all.filter(t=>!/-alpha-/.test(t.name)).sort((a,b)=>stepNum(a.name)-stepNum(b.name));
    const alpha=all.filter(t=>/-alpha-/.test(t.name)).sort((a,b)=>stepNum(a.name)-stepNum(b.name));
    return <div className="palette" key={hue}>
      <div className="palette__head"><span>{HUE_LABEL[hue]}</span><div className="palette__divider"/></div>
      <div className="palette__row">{solid.map(t=>{const v=resolvedMap[t.name]||t.value;const isWhite=/^#fff(fff)?$/i.test(v)||v==="white";return <div key={t.name} className="palette__chip" onClick={()=>copy("var("+t.name+")",say)} title={t.name}>
        <div className="palette__swatch-wrap"><div className="palette__swatch" style={{background:v,border:isWhite?"1px solid var(--cards-on-light-border)":undefined}}/></div>
        <div className="palette__label">{shortName(t.name)}</div>
      </div>})}</div>
      {alpha.length>0&&<div className="palette__alpha">
        <div className="palette__head"><span>Alpha Ramp</span><div className="palette__divider"/></div>
        <div className="palette__row">{alpha.map(t=>{const v=resolvedMap[t.name]||t.value;return <div key={t.name} className="palette__chip" onClick={()=>copy("var("+t.name+")",say)} title={t.name}>
          <div className="palette__swatch-wrap"><div className="palette__swatch palette__swatch--alpha"><div style={{background:v,width:"100%",height:"100%",borderRadius:"inherit"}}/></div></div>
          <div className="palette__label">{shortName(t.name)}</div>
        </div>})}</div>
      </div>}
    </div>;
  })}</>;
}

      <tr><td>Sections</td><td>{"FullTopNav, LimitedTopNav, Footer, SmHero, LgHero, MdProductCardLockup, ZLayout, LgProductSection, SmContentCardLockup, FAQs, Quotes, StatLockup, VideoLockup, LgContentCallout, LgProductCard"}</td></tr>
    </tbody></table>

    <div className="av-h3">### Key Props</div>
    <div className="av-code">{"<Button variant=\"primary|secondary|tertiary\" size=\"lg|sm\" onDark />\n<Tag color=\"purple|pool|mint|lava|mustard|grass\" size=\"lg|sm\" onDark />\n<CoreTypeLockups heading=\"H1|H2|H3|H4|H5|H6\" alignment=\"left|center\"\n  tag tagText=\"...\" button includeSecondary headline=\"...\" subhead=\"...\"\n  hue=\"purple\" onDark desktopSize=\"desktop-plus\" headingTag=\"h1\" />\n<SmHero headline=\"...\" subhead=\"...\" tagText=\"...\"\n  color=\"light|default|muted\" onDark hue=\"purple\" stacked desktopSize=\"desktop-plus\" />\n<LgHero headline=\"...\" subhead=\"...\" tagText=\"...\"\n  color=\"light|default|muted\" onDark hue=\"purple\" desktopSize=\"desktop-plus\" />\n<FAQs title=\"...\" items={[{question,answer}]} defaultOpen={-1}\n  color=\"light|default|muted\" onDark hue=\"purple\" desktopSize=\"desktop-plus\" />\n<Footer hue=\"purple\" variant=\"full|compact\" desktopSize=\"desktop-plus\" />"}</div>

    <hr className="av-divider"/>

    <div className="av-h2">## 7. Naming Rules</div>
    <ul className="av-list">
      <li>{"Hue order: purple, pool, mint, lava, mustard, grass — ALWAYS in this order"}</li>
      <li>{"Purple is the default hue for every component"}</li>
      <li>{"Tags must match the section hue — never a purple tag on a pool section"}</li>
      <li>{"No adjacent dark sections in different hues"}</li>
      <li>{"HTML heading tags (h1–h6) follow sequential document order for SEO"}</li>
      <li>{"FAQ: closed by default, click to open/close, one open at a time"}</li>
      <li>{"LogoCarousel: evenly spaced, 36s linear infinite translate"}</li>
      <li>{"Side-by-side layouts must collapse to column at tablet (808px), not just phone"}</li>
      <li>{"Max 4 cards per row — if more, row must wrap"}</li>
      <li>{"Elevation: coloured glow (0 40px 36px -48px hue at 30-50%), never gray drop shadow"}</li>
      <li>{"Buttons: 0.4s cubic-bezier(0.2,0,0.2,1) transition; press = opacity:0.8"}</li>
      <li>{"No emoji, no exclamation marks, no \"unlock/supercharge/revolutionise\""}</li>
      <li>{"Mixpanel always capitalized. Second person voice. Title Case for buttons under 5 words"}</li>
      <li>{"UPPERCASE only for footer group headers"}</li>
    </ul>

    <hr className="av-divider"/>

    <div className="av-h2">## 8. How to Apply This Skill</div>
    <p className="av-p">{"\"This skill represents\": Surfaces the voice tokens, Heliograph tokens, and\ncomposes Mixpanel tokens: Design, voice, persona, goals, practices. Record VF Kit\nfirst then build out into compositions, pages, and sections.\nSemantic, not Primitives, first-brand delivered, dark and PRIMARY... always\ndesign-system-first.\n\nSurface tokens, design, semantic layout, section pattern assembly. Consider it\nan agent aiming to compose and bring Mixpanel to life in every output and across\nits services. By Section Layout and Page, Rhythm First priority. Direct handover pos\nprocess through a structured token and layout system."}</p>
    <p className="av-p">{"\"The primitiveCollectionMap\": Apply given palette and typography framework\ninto the Figma VF token-mapping system, these are tools facts, fallback and pattern\nidentity.\n\"Mix anything of modules to try and create.\" — Heliograph System"}</p>

    <div className="av-footer">{"Heliograph Design System · Mixpanel · Generated reference for AI agents\nLast updated: "+new Date().toISOString().split("T")[0]}</div>
  </div>;
}

function App(){
  const [data,setData]=useState(null),[err,setErr]=useState(null),[toast,setToast]=useState(null),[sideOpen,setSideOpen]=useState(true),[agentMode,setAgentMode]=useState(false);
  useEffect(()=>{fetch("library-data.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(setData).catch(e=>setErr(String(e)))},[]);
  const say=m=>{setToast(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(null),1600)};
  const resolvedMap=useMemo(()=>{const cs=getComputedStyle(document.documentElement),m={};for(const t of (data?data.tokens:[]))m[t.name]=(cs.getPropertyValue(t.name)||"").trim()||t.value;return m},[data]);
  if(err)return <div className="empty">Could not load <code>library-data.json</code> — {err}</div>;
  if(!data)return <div className="empty">Loading library…</div>;
  const colorTokens=data.tokens.filter(t=>t.file==="colors.css");
  const typographyTokens=data.tokens.filter(t=>t.group==="Typography");
  const primNonColor=data.tokens.filter(t=>t.file==="primitives.css");
  const semLayout=data.tokens.filter(t=>t.group==="Semantic layout");
  const isAssetTok=t=>/^--(favicon|full-logo|logo-mark)/.test(t.name);
  const isAspectTok=t=>/^--aspect-ratio-/.test(t.name);
  const spacingTokens=[...primNonColor.filter(t=>!isAssetTok(t)&&!isAspectTok(t)),...semLayout.filter(t=>!isAspectTok(t))];
  const assetTokens=primNonColor.filter(isAssetTok);
  const coreComps=data.components.filter(c=>c.group==="Core"||c.group==="Forms");
  const patternComps=data.components.filter(c=>c.group==="Patterns");
  const secList=data.components.filter(c=>c.group==="Sections");
  const go=id=>{const el=document.getElementById(id);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-16,behavior:"smooth"})};
  return <div className={"app"+(agentMode?" agent-active":"")+(sideOpen?"":" collapsed")}>
    <aside className="side">
      <button className="sidebar-toggle" onClick={()=>setSideOpen(o=>!o)} title={sideOpen?"Collapse sidebar":"Expand sidebar"}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <div className="side-inner">
        <div className="brand">
          <img src="assets/logos/main-logo-absolute-white.svg" alt="Mixpanel"/>
          <span className="brand-sub">Heliograph Design System</span>
        </div>
        <div className="view-seg">
          <button className={"view-seg__btn"+(!agentMode?" on":"")} onClick={()=>{setAgentMode(false);window.scrollTo(0,0)}}>Human</button>
          <button className={"view-seg__btn"+(agentMode?" on":"")} onClick={()=>{setAgentMode(true);window.scrollTo(0,0)}}>Agent</button>
        </div>
        <div className="navgroup">
          <h4>Contents</h4>
          <div className="nav-divider"/>
          <div className="nav-list">
            {CHAPTERS.map(ch=><button key={ch.id} className="navlink" onClick={()=>go(ch.id)}>{ch.num} {ch.title}</button>)}
          </div>
          <div className="nav-divider"/>
          <div className="nav-list">
            <button className="navlink" onClick={()=>go("primitives")}>List of primitives</button>
            <button className="navlink" onClick={()=>go("semantics")}>List of semantics</button>
          </div>
        </div>
      </div>
    </aside>
    <main>
      <div className="hero" style={{position:"relative"}}>
        <div className="hero__content">
          <Tag color="purple" onDark>Heliograph</Tag>
          <h1>Agentic Design System</h1>
          <p>{"Build and ready to use by your agents. "}</p>
        </div>
      </div>
      {agentMode?<AgentView data={data} resolvedMap={resolvedMap}/>:<>
      <div className="content-panel">
        <section className="chapter" id="color">
          <div className="chapter-head"><span className="chapter-num">01</span><h2>Colors</h2></div>
          <p className="chapter-desc">Primitive colour ramps across eight hues, each with ten solid steps and five alpha variants. Click any swatch to copy its var().</p>
          <ColorRamps tokens={colorTokens} resolvedMap={resolvedMap} say={say}/>
          <div className="usage-in-code">
            <h4>Usage in Code</h4>
            <pre>{"/* Always use semantic tokens in component CSS */\ncolor: var(--text-on-light-body);\nbackground: var(--surface-purple-dark);\n\n/* Primitive colours are for reference — semantic tokens resolve to them */\n/* --colors-purple-06  →  #7856ff */"}</pre>
          </div>
        </section>
        <section className="chapter" id="typography">
          <div className="chapter-head"><span className="chapter-num">02</span><h2>Typography</h2></div>
          <p className="chapter-desc">Garnett throughout — six headline steps, five body steps, each with matching letter-spacing. Click any style detail to copy its var().</p>
          <TypeShowcase say={say}/>
        </section>
        <section className="chapter" id="components">
          <div className="chapter-head"><span className="chapter-num">03</span><h2>Components</h2></div>
          <p className="chapter-desc">Buttons, round icon buttons, and form controls — the atomic building blocks of Heliograph. Click any label to copy.</p>
          <ComponentShowcase say={say}/>
        </section>
        <section className="chapter" id="spacing-layout">
          <div className="chapter-head"><span className="chapter-num">04</span><h2>Spacing & Layout</h2></div>
          <p className="chapter-desc">{spacingTokens.length} tokens — grid system, spacing scale, border radii, shadows and layout semantics.</p>
          <SpacingLayoutShowcase say={say}/>
        </section>
        <section className="chapter" id="logo-icons">
          <div className="chapter-head"><span className="chapter-num">05</span><h2>Logo & Icons</h2></div>
          <p className="chapter-desc">Logo marks, wordmarks, favicons and the full icon set. SVG icons use fill="currentColor".</p>
          <LogoIconShowcase say={say}/>
        </section>
        <section className="chapter" id="patterns">
          <div className="chapter-head"><span className="chapter-num">06</span><h2>Patterns</h2></div>
          <p className="chapter-desc">Composable content blocks that combine tokens, typography and components into reusable layouts.</p>
          <PatternsShowcase say={say}/>
        </section>
        <section className="chapter" id="page-sections">
          <div className="chapter-head"><span className="chapter-num">07</span><h2>Page Sections</h2></div>
          <p className="chapter-desc">Full-width page sections that compose patterns into complete content areas.</p>
          <PageSectionsShowcase secList={secList}/>
        </section>
        <section className="chapter" id="product-imagery">
          <div className="chapter-head"><span className="chapter-num">08</span><h2>Product Imagery</h2></div>
          <p className="chapter-desc">Coming soon.</p>
        </section>
        <section className="chapter" id="data-viz">
          <div className="chapter-head"><span className="chapter-num">09</span><h2>Data Viz</h2></div>
          <p className="chapter-desc">Coming soon.</p>
        </section>
        <section className="chapter" id="brand-strategy">
          <div className="chapter-head"><span className="chapter-num">10</span><h2>Brand Strategy</h2></div>
          <p className="chapter-desc">Coming soon.</p>
        </section>
        <section className="chapter" id="tone-of-voice">
          <div className="chapter-head"><span className="chapter-num">11</span><h2>Tone of Voice</h2></div>
          <p className="chapter-desc">Coming soon.</p>
        </section>
        <PrimitivesList say={say}/>
        <SemanticsList say={say}/>
      </div>
      </>}
    </main>
    {toast&&<div className="toast">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
