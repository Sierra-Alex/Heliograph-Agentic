<script type="text/babel">
const NS=window.HeliographMixpanelDesignSystem_8500f4;
const {Button,RoundIconButton,RoundPlusButton,RoundMinusButton,Tag,Checkbox,Radio,Toggle,TextInput,CoreTypeLockup,HorizontalCoreType,LogoCarousel,ProductCard,ResourceCard,SmResourceCard,Footer,LgHero,LgProductSection,MdProductCardLockup,SmHero,TopNav,ZLayout}=NS;
const {useState,useEffect,useMemo,useRef,useLayoutEffect}=React;

/* Per-component preview: [designWidth|null, node]. null width = flows at natural size with padding. */
const HUES=["purple","pool","mint","lava","peach","mustard","grass"];
const PREVIEW={
  Button:[null,<div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center"}}><Button>Get Started</Button><Button variant="secondary">Learn More</Button><Button variant="tertiary">Read Docs</Button><Button size="sm">Small</Button><Button disabled>Disabled</Button></div>],
  RoundIconButton:[null,<div style={{display:"flex",gap:16,alignItems:"center"}}><RoundIconButton direction="left"/><RoundIconButton direction="right"/><RoundIconButton size="sm" direction="right"/></div>],
  RoundPlusButton:[null,<div style={{display:"flex",gap:16,alignItems:"center"}}><RoundPlusButton/><RoundPlusButton size="sm"/></div>],
  RoundMinusButton:[null,<div style={{display:"flex",gap:16,alignItems:"center"}}><RoundMinusButton/><RoundMinusButton size="sm"/></div>],
  Tag:[null,<div style={{display:"flex",gap:12,flexWrap:"wrap"}}>{HUES.map(c=><Tag key={c} color={c}>{c}</Tag>)}</div>],
  Checkbox:[null,<div style={{display:"flex",gap:20,alignItems:"center"}}><Checkbox/><Checkbox defaultChecked/><Checkbox error/><Checkbox disabled/></div>],
  Radio:[null,<div style={{display:"flex",gap:20,alignItems:"center"}}><Radio name="p"/><Radio name="p" defaultChecked/><Radio error/><Radio disabled/></div>],
  Toggle:[null,<div style={{display:"flex",gap:20,alignItems:"center"}}><Toggle/><Toggle defaultChecked/><Toggle disabled/></div>],
  TextInput:[null,<div style={{display:"flex",gap:16,flexWrap:"wrap"}}><TextInput placeholder="Work email"/><TextInput valid defaultValue="ana@acme.com"/><TextInput error defaultValue="not-an-email"/></div>],
  CoreTypeLockup:[null,<div style={{maxWidth:520}}><CoreTypeLockup heading="H3" tag tagText="Label" button headline="Headline goes here" subhead="Bacon ipsum dolor amet flank brisket prosciutto, pork swine ham strip steak."/></div>],
  HorizontalCoreType:[900,<HorizontalCoreType heading="H3" headline="Headline goes here" subhead="Bacon ipsum dolor amet flank brisket prosciutto, pork swine ham."/>],
  LogoCarousel:[1200,<LogoCarousel stackSizing="sm"/>],
  ProductCard:[1100,<ProductCard color="pool" background="white"/>],
  ResourceCard:[1100,<ResourceCard color="purple" imagePosition="left" alignment="left" largeImage={false}/>],
  SmResourceCard:[null,<div style={{maxWidth:420}}><SmResourceCard color="gray"/></div>],
  TopNav:[1440,<TopNav desktopSize="desktop-plus" logoSrc="assets/logo.svg" caretSrc="assets/icons/caret-down.svg" burgerSrc="assets/icons/burger-menu.svg"/>],
  LgHero:[1440,<LgHero color="purple" includeNav={false} tagText="Platform" headline="Headline goes here"/>],
  SmHero:[1440,<SmHero color="mint" includeNav={false} tagText="Product" headline="Headline goes here"/>],
  ZLayout:[1440,<ZLayout color="pool" imagePosition="left" pageBackground="standard"/>],
  LgProductSection:[1440,<LgProductSection hue="purple" headline="Headline goes here" tagText="Platform"/>],
  MdProductCardLockup:[1440,<MdProductCardLockup color="lava"/>],
  Footer:[1440,<Footer color="purple" logoSrc="assets/mixpanel-logo.svg" includeCta={false}/>],
};

function Frame({width,children}){
  const box=useRef(null),inner=useRef(null);
  const [h,setH]=useState(null),[s,setS]=useState(1);
  useLayoutEffect(()=>{
    if(!width)return;
    const fit=()=>{
      if(!box.current||!inner.current)return;
      const scale=Math.min(1,box.current.clientWidth/width);
      setS(scale);setH(inner.current.getBoundingClientRect().height/scale*scale);
    };
    fit();const t=setTimeout(fit,250);window.addEventListener("resize",fit);
    return()=>{clearTimeout(t);window.removeEventListener("resize",fit)};
  },[width]);
  if(!width)return <div className="frame pad">{children}</div>;
  return <div className="frame" ref={box} style={{height:h?h:undefined}}>
    <div className="stage" ref={inner} style={{width,transform:`scale(${s})`}}>{children}</div>
  </div>;
}

function copy(text,say){
  const done=()=>say(text.length>42?"Copied":"Copied “"+text+"”");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,done);
  else{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done()}
}

function ComponentCard({c,say}){
  const [tab,setTab]=useState("props");
  const pv=PREVIEW[c.name];
  const brief=(c.summary||c.desc||"").replace(/\s+/g," ");
  return <div className="card" id={"c-"+c.name}>
    <div className="cardhead">
      <div>
        <h3>{c.name}</h3>
        <p>{brief}</p>
      </div>
      <div className="acts">
        <button className="mini" onClick={()=>copy(c.name,say)}>Copy name</button>
        {c.example&&<button className="mini" onClick={()=>copy(c.example,say)}>Copy usage</button>}
      </div>
    </div>
    {pv&&<Lazy minHeight={pv[0]?320:120}><Frame width={pv[0]}>{pv[1]}</Frame></Lazy>}
    <div className="meta">
      <div className="acts">
        <button className={"mini"+(tab==="props"?" on":"")} onClick={()=>setTab("props")}>Props ({c.props.length})</button>
        {c.example&&<button className={"mini"+(tab==="code"?" on":"")} onClick={()=>setTab("code")}>Example</button>}
        <button className={"mini"+(tab==="files"?" on":"")} onClick={()=>setTab("files")}>Files</button>
      </div>
      {tab==="props"&&(c.props.length?<table><thead><tr><th style={{width:"23%"}}>Prop</th><th style={{width:"30%"}}>Type</th><th style={{width:"17%"}}>Default</th><th style={{width:"30%"}}>Notes</th></tr></thead><tbody>
        {c.props.map((p,i)=><tr key={p.name+i}><td className="n">{p.name}{p.required&&<span className="req">req</span>}</td><td className="t">{p.type}</td><td className="d">{p.def||"—"}</td><td>{p.doc||""}</td></tr>)}
      </tbody></table>:<p className="paths">No own props.</p>)}
      {tab==="props"&&c.extends&&<p className="paths">Also accepts all <b>{c.extends}</b> attributes.</p>}
      {tab==="code"&&<pre>{c.example}</pre>}
      {tab==="files"&&<div className="paths">{c.files.map(f=><div key={f}>{f}</div>)}{c.notes&&<p style={{marginTop:10,fontFamily:"var(--font-family-primary)",fontSize:12}}>{c.notes}</p>}</div>}
    </div>
  </div>;
}

function Thumb({children,src}){
  const box=useRef(null),[s,setS]=useState(.24);
  useLayoutEffect(()=>{
    const f=()=>{if(box.current)setS(box.current.clientWidth/1440)};
    f();window.addEventListener("resize",f);return()=>window.removeEventListener("resize",f);
  },[]);
  return <div className="shot" ref={box}>{src
    ?<iframe src={src} loading="lazy" scrolling="no" style={{transform:`scale(${s})`}}/>
    :<div style={{transform:`scale(${s})`}}>{children}</div>}</div>;
}

function SectionTile({c}){
  return <a className="tile" href={"section.html?c="+c.name}>
    <Lazy minHeight={190}><Thumb>{PREVIEW[c.name]?PREVIEW[c.name][1]:null}</Thumb></Lazy>
    <div className="tilemeta"><h3>{c.name}</h3><p>{(c.summary||"").replace(/\s+/g," ")}</p><em>Open with controls →</em></div>
  </a>;
}

const TEMPLATES=[{name:"Marketing page",href:"templates/marketing-page/MarketingPage.dc.html",desc:"Full marketing page starter — nav, hero, Z-layouts, product cards and footer, already wired to Heliograph."}];

function TemplateTile({t}){
  return <a className="tile" href={t.href}>
    <Lazy minHeight={190}><Thumb src={t.href}/></Lazy>
    <div className="tilemeta"><h3>{t.name}</h3><p>{t.desc}</p><em>Open template →</em></div>
  </a>;
}

function Lazy({minHeight,children}){
  const ref=useRef(null),[on,setOn]=useState(false);
  useEffect(()=>{
    if(!ref.current)return;
    const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){setOn(true);io.disconnect()}},{rootMargin:"600px 0px"});
    io.observe(ref.current);return()=>io.disconnect();
  },[]);
  return <div ref={ref} style={on?undefined:{minHeight}}>{on?children:null}</div>;
}

const HUES_ORDER=["gray","purple","pool","mint","lava","peach","mustard","grass","white","black"];
function family(t){
  if(t.file==="colors.css"){
    const m=t.name.match(/^--colors-([a-z]+)/);
    return m?m[1]:"other";
  }
  const m=t.name.match(/^--([a-z]+(?:-[a-z]+)?)-/);
  const seg=(t.name.split("-").filter(Boolean)[0])||"other";
  return seg;
}
const FAMILY_LABEL={gray:"Gray",purple:"Purple",pool:"Pool",mint:"Mint",lava:"Lava",peach:"Peach",mustard:"Mustard",grass:"Grass",white:"White",black:"Black",
  surface:"Surface",text:"Text",cards:"Cards",tag:"Tag",interactive:"Interactive",container:"Container fills",divider:"Dividers",status:"Status",absolute:"Absolute",other:"Other"};
function familyRank(f){const i=HUES_ORDER.indexOf(f);return i<0?100+f.charCodeAt(0):i}
function stepNum(name){const m=name.match(/-(\d+)$/);return m?parseInt(m[1],10):999}
function isAlpha(name){return /-alpha-\d+$/.test(name)}
function bySt3p(a,b){return stepNum(a[0].name)-stepNum(b[0].name)||a[0].name.localeCompare(b[0].name)}
function prefixOf(name){
  const segs=name.replace(/^--/,"").split("-").filter(x=>!/^\d+(\.\d+)?$/.test(x));
  return segs.length>2?segs.slice(0,2).join("-"):segs.join("-")||"other";
}
function titleize(p){return p.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ")}
function alphaNote(f,rows){
  const ns=rows.map(r=>stepNum(r[0].name)).filter(n=>n<999).sort((a,b)=>a-b);
  const range=ns.length?(ns[0]===ns[ns.length-1]?ns[0]+"%":ns[0]+"–"+ns[ns.length-1]+"%"):"";
  const subject=f==="absolute"?"Black and white":"The "+(FAMILY_LABEL[f]||f).toLowerCase()+" base hue";
  return "Alpha variants — "+subject.charAt(0).toLowerCase()+subject.slice(1)+" at "+range+" opacity. Use these over imagery or coloured surfaces, never a solid step with your own opacity.";
}

const KIND_ORDER=["color","gradient","type","size","shadow","asset","other"];
const KIND_LABEL={color:"Colour",gradient:"Gradient",type:"Type styles",size:"Sizes & spacing",shadow:"Shadows & blurs",asset:"Asset references",other:"Other"};
const KIND_COLS={color:"col-a",gradient:"col-b",type:"col-1",size:"col-a",shadow:"col-b",asset:"col-a",other:"col-b"};

function classify(v){
  if(/^(linear-gradient|radial-gradient)/.test(v))return "gradient";
  if(/^(#|rgb|hsl)/.test(v))return "color";
  if(/^url\(/.test(v))return "asset";
  if(/^\d+\s+[\d.]+px\s*\/\s*[\d.]+\s+\w/.test(v))return "type";
  if(/(rgba?\(|#[0-9a-f]{3,8})/i.test(v)&&/px/.test(v))return "shadow";
  if(/^-?[\d.]+(px|em|rem|%|s|ms)?$/.test(v))return "size";
  return "other";
}

function TokenChip({t,resolved,kind,maxSize,say}){
  const click=()=>copy("var("+t.name+")",say);
  const tip=t.name+" — click to copy var()";
  const short=resolved.length>64?resolved.slice(0,64)+"…":resolved;
  const body=<div className="tokbody"><div className="tokname">{t.name}</div><div className="tokval">{short}</div></div>;
  if(kind==="color")return <div className="tok flat" onClick={click} title={tip}><div className="sw" style={{background:resolved}}/>{body}</div>;
  if(kind==="gradient")return <div className="tok stack" onClick={click} title={tip}><div className="bar" style={{background:resolved}}/>{body}</div>;
  if(kind==="shadow")return <div className="tok stack" onClick={click} title={tip}><div className="shadowtile"><i style={{boxShadow:resolved}}/></div>{body}</div>;
  if(kind==="type"){
    const px=parseFloat((resolved.match(/([\d.]+)px/)||[])[1])||16;
    return <div className="tok stack" onClick={click} title={tip}>
      <div className="typerow"><span style={{font:resolved,letterSpacing:px>=28?"-0.02em":undefined}}>Ag — Heliograph</span></div>
      {body}
    </div>;
  }
  if(kind==="size"){
    const n=parseFloat(resolved)||0;
    const w=maxSize>0?Math.max(2,Math.min(48,(n/maxSize)*48)):0;
    return <div className="tok flat" onClick={click} title={tip}>
      <div className="tokbody"><div className="tokname">{t.name}</div></div>
      {/px|rem|em/.test(resolved)&&<div className="sizebar" style={{width:w}}/>}
      <div className="tokval num">{resolved}</div>
    </div>;
  }
  return <div className="tok flat" onClick={click} title={tip}>{body}</div>;
}

function TokenGroup({list,resolvedMap,say}){
  const buckets={};
  for(const t of list){const v=resolvedMap[t.name]||t.value;(buckets[classify(v)]=buckets[classify(v)]||[]).push([t,v])}
  return <>{KIND_ORDER.filter(k=>buckets[k]).map(k=>{
    const rows=buckets[k];
    const maxSize=k==="size"?Math.max(...rows.map(([,v])=>parseFloat(v)||0)):0;
    if(k==="type"){
      const g={};
      for(const r of rows){const p=prefixOf(r[0].name).split("-")[0];(g[p]=g[p]||[]).push(r)}
      const rank={headline:0,body:1,component:2};
      const order=Object.keys(g).sort((a,b)=>(rank[a]??9)-(rank[b]??9)||a.localeCompare(b));
      const LBL={headline:"Headlines",body:"Body",component:"Component styles"};
      const NOTE={headline:"Display and heading steps. H1 60px down to H5 22px — the ramp stops at H5; there is no H6 or H7 token.",
                  body:"Paragraph and caption steps, each with a 400 regular and a 500 medium cut.",
                  component:"Fixed styles baked into components — button labels, tags, inputs. Prefer the component over the token."};
      return <div className="kind" key={k}>
        <div className="kindhead"><h3>{KIND_LABEL[k]}</h3><span>{rows.length}</span></div>
        {order.map(p=><div className="fam" key={p}>
          <div className="famhead"><h4>{LBL[p]||titleize(p)}</h4><span>{g[p].length}</span></div>
          {NOTE[p]&&<p className="callout">{NOTE[p]}</p>}
          <div className={"toks "+KIND_COLS[k]}>{g[p].map(([t,v])=><TokenChip key={t.name} t={t} resolved={v} kind={k} say={say}/>)}</div>
        </div>)}
      </div>;
    }
    if(k==="size"||k==="other"){
      const g={};
      for(const r of rows){const p=prefixOf(r[0].name);(g[p]=g[p]||[]).push(r)}
      const order=Object.keys(g).sort((a,b)=>a.localeCompare(b));
      return <div className="kind" key={k}>
        <div className="kindhead"><h3>{KIND_LABEL[k]}</h3><span>{rows.length}</span></div>
        {order.map(p=>{
          const rs=g[p].slice().sort((a,b)=>(parseFloat(a[1])||0)-(parseFloat(b[1])||0)||a[0].name.localeCompare(b[0].name));
          const mx=Math.max(...rs.map(([,v])=>parseFloat(v)||0));
          return <div className="fam" key={p}>
            <div className="famhead"><h4>{titleize(p)}</h4><span>{rs.length}</span></div>
            <div className={"toks "+KIND_COLS[k]}>{rs.map(([t,v])=><TokenChip key={t.name} t={t} resolved={v} kind={k} maxSize={mx} say={say}/>)}</div>
          </div>;
        })}
      </div>;
    }
    if(k==="color"){
      const fams={};
      for(const r of rows){const f=family(r[0]);(fams[f]=fams[f]||[]).push(r)}
      const order=Object.keys(fams).sort((a,b)=>familyRank(a)-familyRank(b));
      return <div className="kind" key={k}>
        <div className="kindhead"><h3>{KIND_LABEL[k]}</h3><span>{rows.length}</span></div>
        {order.map(f=>{
          const base=fams[f].filter(r=>!isAlpha(r[0].name)).sort(bySt3p);
          const alpha=fams[f].filter(r=>isAlpha(r[0].name)).sort(bySt3p);
          return <div className="fam" key={f}>
            <div className="famhead"><h4>{FAMILY_LABEL[f]||f}</h4><span>{fams[f].length}</span></div>
            {base.length>0&&<div className={"toks "+KIND_COLS[k]}>{base.map(([t,v])=><TokenChip key={t.name} t={t} resolved={v} kind={k} say={say}/>)}</div>}
            {alpha.length>0&&<div className="alphas">
              <p className="callout">{alphaNote(f,alpha)}</p>
              <div className={"toks "+KIND_COLS[k]}>{alpha.map(([t,v])=><TokenChip key={t.name} t={t} resolved={v} kind={k} say={say}/>)}</div>
            </div>}
          </div>;
        })}
      </div>;
    }
    return <div className="kind" key={k}>
      <div className="kindhead"><h3>{KIND_LABEL[k]}</h3><span>{rows.length}</span></div>
      <div className={"toks "+KIND_COLS[k]}>{rows.map(([t,v])=><TokenChip key={t.name} t={t} resolved={v} kind={k} maxSize={maxSize} say={say}/>)}</div>
    </div>;
  })}</>;
}

function App(){
  const [data,setData]=useState(null),[err,setErr]=useState(null),[q,setQ]=useState(""),[toast,setToast]=useState(null),[sideOpen,setSideOpen]=useState(true);
  useEffect(()=>{fetch("library-data.json").then(r=>r.json()).then(setData).catch(e=>setErr(String(e)))},[]);
  const say=m=>{setToast(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(null),1600)};
  const resolvedMap=useMemo(()=>{const cs=getComputedStyle(document.documentElement),m={};for(const t of (data?data.tokens:[]))m[t.name]=(cs.getPropertyValue(t.name)||"").trim()||t.value;return m},[data]);
  if(err)return <div className="empty">Could not load <code>library-data.json</code> — {err}</div>;
  if(!data)return <div className="empty">Loading library…</div>;
  const needle=q.trim().toLowerCase();
  const match=s=>!needle||String(s).toLowerCase().includes(needle);
  const comps=data.components.filter(c=>match(c.name)||match(c.summary)||match(c.group)||c.props.some(p=>match(p.name)));
  const toks=data.tokens.filter(t=>match(t.name)||match(t.value));
  const secList=comps.filter(c=>c.group==="Sections");
  const cGroups=["Core","Forms","Patterns"].map(g=>[g,comps.filter(c=>c.group===g)]).filter(x=>x[1].length);
  const tGroups=[...new Set(data.tokens.map(t=>t.group))].map(g=>[g,toks.filter(t=>t.group===g)]).filter(x=>x[1].length);
  const go=id=>{const el=document.getElementById(id);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-16,behavior:"smooth"})};
  return <div className={"app"+(sideOpen?"":" collapsed")}>
    <aside className="side">
      <button className="sidebar-toggle" onClick={()=>setSideOpen(o=>!o)} title={sideOpen?"Collapse sidebar":"Expand sidebar"}>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <div className="side-inner">
        <div className="brand"><img src="assets/logo.svg" alt="Mixpanel"/><span>Heliograph</span></div>
        <input className="search" placeholder="Search components & tokens…" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="navgroup"><h4>Tokens</h4>
          {tGroups.map(([g,list])=><button key={g} className="navlink" onClick={()=>go("t-"+g)}>{g}<em>{list.length}</em></button>)}
        </div>
        <div className="navgroup"><h4>Components</h4>
          {cGroups.map(([g,list])=><button key={g} className="navlink" onClick={()=>go("g-"+g)}>{g}<em>{list.length}</em></button>)}
        </div>
        <div className="navgroup"><h4>Sections</h4>
          <button className="navlink" onClick={()=>go("sections")}>Page sections<em>{secList.length}</em></button>
          <button className="navlink" onClick={()=>go("templates")}>Templates<em>{TEMPLATES.length}</em></button>
        </div>
        <div className="navgroup"><h4>Elsewhere</h4>
          <a className="navlink" href="readme.md">Readme</a>
          <a className="navlink" href="ui_kits/marketing_site/index.html">Marketing site kit</a>
          <a className="navlink" href="guidelines/design-guidelines.md">Design guidelines</a>
        </div>
      </div>
    </aside>
    <main>
      <div className="hero">
        <h1>Heliograph library</h1>
        <p>Every component and token in Mixpanel’s marketing design system, in one browsable page. Names here are the standard names — copy one, paste it into Claude, and it will build against the real system.</p>
        <div className="acts">
          <button className="mini on" onClick={()=>copy(data.components.map(c=>c.name).join(", "),say)}>Copy all {data.components.length} component names</button>
          <button className="mini" onClick={()=>copy("Use the Heliograph design system. Components available: "+data.components.map(c=>c.name).join(", ")+". Style everything with the Heliograph CSS custom properties (var(--…)) — never hard-coded hex or px values.",say)}>Copy a starter prompt</button>
        </div>
      </div>
      <div className="howto">
        <div><h5>1 · Find it</h5><p>Search by component name, prop name or token name. Every card shows the live component, not a screenshot.</p></div>
        <div><h5>2 · Copy the name</h5><p>Component names are the shared vocabulary. “Use a ZLayout with a ProductCard below it” is a complete instruction.</p></div>
        <div><h5>3 · Paste into Claude</h5><p>With this design system attached, Claude resolves those names to the real implementations and token values.</p></div>
      </div>
      {tGroups.map(([g,list])=><section className="sec" id={"t-"+g} key={g}>
        <div className="sechead"><h2>{g}</h2><p>{list.length} tokens · tokens/{list[0].file} · click any token to copy its var()</p></div>
        <TokenGroup list={list} resolvedMap={resolvedMap} say={say}/>
      </section>)}
      {cGroups.map(([g,list])=><section className="sec" id={"g-"+g} key={g}>
        <div className="sechead"><h2>{g}</h2><p>{list.length} component{list.length>1?"s":""} · components/{list[0].dir}/</p></div>
        <div className="grid">{list.map(c=><ComponentCard key={c.name} c={c} say={say}/>)}</div>
      </section>)}
      {secList.length>0&&<section className="sec" id="sections">
        <div className="sechead"><h2>Sections</h2><p>{secList.length} full-width page sections · click one to open it with its controls</p></div>
        <div className="tiles">{secList.map(c=><SectionTile key={c.name} c={c}/>)}</div>
      </section>}
      {!needle&&<section className="sec" id="templates">
        <div className="sechead"><h2>Templates</h2><p>{TEMPLATES.length} starting point{TEMPLATES.length>1?"s":""} · templates/</p></div>
        <div className="tiles">{TEMPLATES.map(t=><TemplateTile key={t.name} t={t}/>)}</div>
      </section>}
      {!comps.length&&!toks.length&&<div className="empty">Nothing matches “{q}”.</div>}
    </main>
    {toast&&<div className="toast">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
