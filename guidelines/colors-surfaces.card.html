<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Three light surfaces and six dark product surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{background:var(--surface-light);padding:16px}.g{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.c{height:70px;border-radius:8px;border:1px solid var(--divider-on-light)}.n{font:var(--body-b5);color:var(--text-on-light-body);margin-top:6px}</style></head><body><div class="g"><div><div class="c" style="background:var(--surface-default)"></div><div class="n">default</div></div><div><div class="c" style="background:var(--surface-light)"></div><div class="n">light</div></div><div><div class="c" style="background:var(--surface-muted)"></div><div class="n">muted</div></div><div><div class="c" style="background:var(--surface-purple-dark)"></div><div class="n">purple-dark</div></div><div><div class="c" style="background:var(--surface-pool-dark)"></div><div class="n">pool-dark</div></div><div><div class="c" style="background:var(--surface-mint-dark)"></div><div class="n">mint-dark</div></div><div><div class="c" style="background:var(--surface-lava-dark)"></div><div class="n">lava-dark</div></div><div><div class="c" style="background:var(--surface-mustard-dark)"></div><div class="n">mustard-dark</div></div><div><div class="c" style="background:var(--surface-grass-dark)"></div><div class="n">grass-dark</div></div></div></body></html>
