<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Heliograph — section viewer</title>
<link rel="stylesheet" href="styles.css?v=20">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js?v=20"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
body{background:var(--surface-muted);color:var(--text-on-light-body);font-family:var(--font-family-primary);-webkit-font-smoothing:antialiased}
a{color:var(--text-on-light-link);text-decoration:none}a:hover{color:var(--text-on-light-headline)}
.wrap{display:grid;grid-template-rows:56px minmax(0,1fr);height:100vh}
.bar{display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface-light);border-bottom:1px solid var(--cards-on-light-border)}
.bar .back{font:var(--body-b5);letter-spacing:var(--letter-spacing-2);color:var(--colors-gray-08)}
.bar h1{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:600;color:var(--text-on-light-headline)}
.picker{position:relative;display:flex;align-items:center;gap:4px;padding:5px 10px 5px 12px;border-radius:999px;border:1px solid var(--cards-on-light-border);background:var(--surface-default)}
.picker:hover{background:var(--surface-muted)}
.picker .jump{position:absolute;inset:0;width:100%;height:100%;padding:0 32px 0 0;border:0;border-radius:999px;background:none;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.picker::after{content:"";width:9px;height:9px;margin-left:2px;background:url("assets/icons/caret-down.svg") no-repeat center/contain;opacity:.55;pointer-events:none}
.bar .sp{flex:1}
.picker:focus-within{border-color:var(--colors-purple-06)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;transition:grid-template-columns .25s ease}
.body.collapsed{grid-template-columns:minmax(0,1fr) 48px}
.canvas{overflow:auto;padding:32px;display:flex;justify-content:center;align-items:flex-start}
.sheet{background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.10);overflow:clip;flex-shrink:0;height:fit-content}
.panel{border-left:1px solid var(--cards-on-light-border);background:var(--surface-light);overflow-y:auto;padding:22px 20px 60px;display:flex;flex-direction:column;gap:22px;transition:padding .25s ease;min-width:0;overflow-x:hidden}
.body.collapsed .panel{padding:12px 10px 60px;align-items:center}
.panel-inner{display:flex;flex-direction:column;gap:22px;transition:opacity .2s ease;min-width:0}
.body.collapsed .panel-inner{opacity:0;pointer-events:none;height:0;overflow:hidden}
.panel-toggle{align-self:flex-start;flex-shrink:0;width:28px;height:28px;border-radius:8px;border:1px solid var(--cards-on-light-border);background:var(--surface-default);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.panel-toggle:hover{background:var(--surface-muted)}
.panel-toggle svg{width:14px;height:14px;color:var(--text-on-light-body);transition:transform .25s ease}
.body.collapsed .panel-toggle svg{transform:rotate(180deg)}
.panel h2{margin:0;font:500 11px/1.4 garnett;letter-spacing:var(--letter-spacing-2);text-transform:uppercase;color:var(--colors-gray-08)}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl label{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text-on-light-headline)}
.ctl .doc{font:var(--body-b5);font-size:11.5px;color:var(--colors-gray-08);text-wrap:pretty}
.sw{display:flex;align-items:center;gap:10px}
.sw span{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text-on-light-headline)}
.radiorow{display:flex;align-items:center;gap:8px;cursor:pointer}
.radiorow span{font:var(--body-b5);letter-spacing:var(--letter-spacing-2);color:var(--text-on-light-body)}
.radiorow:hover span{color:var(--text-on-light-headline)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.panel .text-input{width:100%}
.group{display:flex;flex-direction:column;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--cards-on-light-border)}
pre{margin:0;padding:12px 14px;border-radius:12px;background:#150040;color:#e8e6f2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.note{font:var(--body-b5);font-size:11.5px;color:var(--colors-gray-08);text-wrap:pretty}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:6px !important;position:relative}
.icon-btn svg{width:100%;height:100%;color:var(--text-on-light-body);pointer-events:none}
.icon-btn.on svg{color:var(--text-on-light-headline)}
.icon-btn .icon-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface-purple-dark);color:#fff;font:var(--body-b5);font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:10;pointer-events:none}
.icon-btn:hover .icon-tip{display:block}
.seg{display:flex}
.seg .mini{border-radius:0;margin-left:-1px}
.seg .mini:first-child{border-radius:var(--border-radius-control) 0 0 var(--border-radius-control);margin-left:0}
.seg .mini:last-child{border-radius:0 var(--border-radius-control) var(--border-radius-control) 0}
.seg .mini.on{z-index:1;position:relative}
.panel .seg{flex-wrap:wrap;gap:4px}
.panel .seg .mini{border-radius:var(--border-radius-control);margin-left:0}
.panel .seg .mini:first-child{border-radius:var(--border-radius-control)}
.panel .seg .mini:last-child{border-radius:var(--border-radius-control)}
.mini{font-family:var(--font-family-primary);font-size:12px;letter-spacing:.02em;padding:7px 12px;border-radius:999px;border:1px solid var(--cards-on-light-border);background:var(--surface-default);color:var(--text-on-light-body);cursor:pointer;white-space:nowrap}
.mini:hover{background:var(--surface-muted);color:var(--text-on-light-headline)}
.mini.on{background:var(--surface-light);border-color:var(--text-on-light-headline);color:var(--text-on-light-headline)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-purple-dark);color:#fff;padding:11px 18px;border-radius:999px;font:var(--body-b5);z-index:50}
.empty{padding:40px;font:var(--body-b5)}
</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS=window.HeliographMixpanelDesignSystem_8500f4;
const {useState,useEffect,useMemo,useRef,useLayoutEffect}=React;
const VIEWPORTS={"desktop-plus":1440,desktop:1200,tablet:808,phone:384};
const EXTRA={FullTopNav:{logoSrc:"assets/logos/main-logo-gray-10.svg",caretSrc:"assets/icons/caret-down.svg",burgerSrc:"assets/icons/burger-menu.svg"},Footer:{logoSrc:"assets/logos/main-logo-absolute-white.svg"},LgHero:{logoSrc:"assets/logos/main-logo-gray-10.svg"},SmHero:{logoSrc:"assets/logos/main-logo-gray-10.svg"}};
const SKIP=/^(children|className|style|cards|links)$/;

function enumOf(type){
  if(!type)return null;
  const t=type.trim();
  if(/[{}[\]]|=>/.test(t))return null;
  if(!t.includes("|"))return null;
  const parts=t.split("|").map(s=>s.trim());
  if(parts.every(p=>/^".*"$/.test(p)))return parts.map(p=>p.slice(1,-1));
  if(parts.every(p=>/^\d+$/.test(p)))return parts.map(Number);
  return null;
}
function parseDef(def){
  if(def==null)return undefined;
  const d=String(def).trim();
  if(d==="true")return true;if(d==="false")return false;
  if(/^".*"$/.test(d))return d.slice(1,-1);
  if(/^\d+$/.test(d))return Number(d);
  return d;
}
function controlsFor(c){
  return c.props.map(p=>{
    if(SKIP.test(p.name)||p.name==="viewport"||p.name==="desktopSize")return null;
    const opts=enumOf(p.type);
    if(opts)return {...p,kind:"enum",opts};
    if(p.type==="boolean")return {...p,kind:"bool"};
    if(p.type==="string"&&!/Src$/.test(p.name))return {...p,kind:"text"};
    return null;
  }).filter(Boolean);
}
function copy(text,say){
  const done=()=>say("Copied");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done,done);
  else{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done()}
}
function snippet(name,vals){
  const attrs=Object.entries(vals).filter(([,v])=>v!==undefined&&v!=="").map(([k,v])=>
    typeof v==="string"?`${k}="${v}"`:`${k}={${JSON.stringify(v)}}`);
  return attrs.length?`<${name}\n  ${attrs.join("\n  ")}\n/>`:`<${name} />`;
}

function App(){
  const [data,setData]=useState(null),[toast,setToast]=useState(null);
  const [vals,setVals]=useState({});
  const [panelOpen,setPanelOpen]=useState(true);
  const [vp,setVp]=useState("desktop-plus");
  const [fit,setFit]=useState(true);
  const name=new URLSearchParams(location.search).get("c")||"LgHero";
  const box=useRef(null),[scale,setScale]=useState(1);
  useEffect(()=>{fetch("library-data.json?v=20").then(r=>r.json()).then(setData)},[]);
  const say=m=>{setToast(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(null),1500)};
  const c=data&&data.components.find(x=>x.name===name);
  const ctls=useMemo(()=>c?controlsFor(c):[],[c]);
  useEffect(()=>{if(!c)return;const v={};for(const p of controlsFor(c)){const d=parseDef(p.def);if(d!==undefined)v[p.name]=d}setVals(v);
    const vpProp=c.props.find(p=>p.name==="viewport"||p.name==="desktopSize");if(vpProp)setVp(parseDef(vpProp.def)||"desktop-plus");},[c]);
  const width=VIEWPORTS[vp]||1440;
  useLayoutEffect(()=>{
    const f=()=>{if(!box.current)return;const avail=box.current.clientWidth-64;setScale(fit?Math.min(1,avail/width):1)};
    f();window.addEventListener("resize",f);return()=>window.removeEventListener("resize",f);
  },[width,fit,c]);
  if(!data)return <div className="empty">Loading…</div>;
  if(!c||!NS[name])return <div className="empty">No component named “{name}”. <a href="index.html">Back to the library</a>.</div>;
  const El=NS[name];
  const vpKey=c.props.some(p=>p.name==="viewport")?"viewport":c.props.some(p=>p.name==="desktopSize")?"desktopSize":null;
  const props={...EXTRA[name],...vals};
  if(vpKey)props[vpKey]=vp;
  const set=(k,v)=>setVals(s=>({...s,[k]:v}));
  return <div className="wrap">
    <div className="bar">
      <a className="back" href="index.html">← Heliograph library</a>
      <div className="picker">
        <h1>{name}</h1>
        <select className="jump" value={name} onChange={e=>{location.search="?c="+e.target.value}} aria-label="Choose a section">
          {data.components.filter(x=>x.group==="Sections").map(x=><option key={x.name} value={x.name}>{x.name}</option>)}
        </select>
      </div>
      {NS.Button&&<NS.Button variant="secondary" size="sm" onClick={()=>copy(name,say)} title={"Copy “"+name+"”"}>Copy</NS.Button>}
      <span className="sp"/>
      <div className="seg">{Object.keys(VIEWPORTS).map(k=><button key={k} className={"mini"+(vp===k?" on":"")} onClick={()=>setVp(k)}>{k}</button>)}</div>
      <label className="radiorow">
        {NS.Toggle&&<NS.Toggle checked={fit} onChange={e=>setFit(e.target.checked)}/>}
        <span>Fit</span>
      </label>
    </div>
    <div className={"body"+(panelOpen?"":" collapsed")}>
      <div className="canvas" ref={box}>
        <div className="sheet" style={{width,zoom:scale}}><El {...props}/></div>
      </div>
      <aside className="panel">
        <button className="panel-toggle" onClick={()=>setPanelOpen(o=>!o)} title={panelOpen?"Collapse panel":"Expand panel"}>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <div className="panel-inner">
        <div className="group">
          <h2>Options</h2>
          {ctls.map(p=>{
            const v=vals[p.name];
            if(p.kind==="enum"){const isIcon=p.name==="icon"&&NS.ICON_PATHS;return <div className="ctl" key={p.name}>
              <label>{p.name}</label>
              {p.doc&&<div className="doc">{p.doc}</div>}
              <div className="seg">{p.opts.map(o=>{if(isIcon&&NS.ICON_PATHS[o]){const pp=NS.ICON_PATHS[o];return <button key={String(o)} className={"mini icon-btn"+(v===o?" on":"")} onClick={()=>set(p.name,o)}><svg viewBox="0 0 24 24" fill="none">{pp.map((g,i)=>React.createElement("path",{key:i,d:g.d,fill:"currentColor",fillRule:g.fr||undefined,clipRule:g.fr||undefined}))}</svg><span className="icon-tip">{String(o)}</span></button>}return <button key={String(o)} className={"mini"+(v===o?" on":"")} onClick={()=>set(p.name,o)}>{String(o)}</button>})}</div>
            </div>;}
            if(p.kind==="bool")return <div className="ctl" key={p.name}>
              <div className="sw">
                {NS.Toggle&&<NS.Toggle checked={!!v} onChange={e=>set(p.name,e.target.checked)}/>}
                <span>{p.name}</span>
              </div>
              {p.doc&&<div className="doc">{p.doc}</div>}
            </div>;
            return <div className="ctl" key={p.name}>
              <label>{p.name}</label>
              {NS.TextInput&&<NS.TextInput value={v||""} placeholder="component default" onChange={e=>set(p.name,e.target.value)}/>}
            </div>;
          })}
          {!ctls.length&&<p className="note">This section takes no simple options.</p>}
        </div>
        <div className="group">
          <h2>Usage</h2>
          <pre>{snippet(name,{...vals,...(vpKey?{[vpKey]:vp}:{})})}</pre>
          <div className="actions">
            {NS.Button&&<NS.Button variant="primary" size="sm" onClick={()=>copy(snippet(name,{...vals,...(vpKey?{[vpKey]:vp}:{})}),say)}>Copy JSX</NS.Button>}
            {NS.Button&&<NS.Button variant="secondary" size="sm" onClick={()=>copy(name,say)}>Copy name</NS.Button>}
          </div>
        </div>
        <div>
          <h2>Files</h2>
          <p className="note" style={{fontFamily:"ui-monospace,Menlo,monospace",marginTop:8}}>{c.files.join("\n")}</p>
          {c.summary&&<p className="note">{c.summary}</p>}
        </div>
        </div>
      </aside>
    </div>
    {toast&&<div className="toast">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
