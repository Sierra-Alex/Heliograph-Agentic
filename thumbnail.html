<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0;background:var(--surface-light)}
.tile{width:1280px;height:854px;display:flex;overflow:hidden}
.main{width:960px;height:854px;background:var(--colors-purple-06);display:flex;align-items:center;justify-content:center}
.main img{width:640px;height:152px;filter:brightness(0) invert(1)}
.strip{width:320px;height:854px;display:flex;flex-direction:column}.strip div{width:320px;height:213.5px}</style></head>
<body><div class="tile">
<div class="main"><img src="assets/mixpanel-logo.svg" alt="Mixpanel"></div>
<div class="strip"><div style="background:var(--colors-mustard-06)"></div><div style="background:var(--colors-mint-06)"></div><div style="background:var(--colors-lava-06)"></div><div style="background:var(--colors-pool-06)"></div></div>
</div></body></html>
